name: Build & Release Desktop

# Tag `vX.Y.Z` → stable release (latest.yml). Tag `vX.Y.Z-beta.N` → GitHub
# prerelease on the "beta" update channel (beta.yml). electron-builder derives
# the channel from the semver prerelease component of package.json "version",
# so the tag and the version field must agree.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      npm_config_msvs_version: '2022'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup MSVC for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      - name: Verify node-pty Linux build tools
        if: runner.os == 'Linux'
        run: |
          python3 --version
          make --version
          g++ --version

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build Application Bundle
        run: npm run build

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            if (!fs.existsSync("CHANGELOG.md")) process.exit(0);
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const header = `## [${tag}]`;
            let inSection = false;
            const sectionLines = [];
            for (const line of lines) {
              if (line.startsWith("## [")) {
                if (line.startsWith(header)) {
                  inSection = true;
                  continue;
                } else if (inSection) {
                  break;
                }
              }
              if (inSection) sectionLines.push(line);
            }
            const notes = sectionLines.join("\n").replace(/^---$/gm, "").trim();
            if (notes) {
              fs.writeFileSync("release-notes.md", notes);
              const tagStr = process.env.GITHUB_REF_NAME || "";
              const topicMatch = notes.match(/\*\*(.*?)\*\*/);
              const title = topicMatch ? `${tagStr} - ${topicMatch[1]}` : tagStr;
              fs.writeFileSync("release-title.txt", title);
              console.log("Extracted release notes for " + tag + ":\n" + notes);
            }
          '

      # --- PUBLISH (tags) ---
      # electron-builder uploads installers, blockmaps and latest.yml / beta.yml
      # to a GitHub Release named after the tag, creating it if it doesn't exist.
      - name: Package & Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds: skip macOS code signing / notarisation until a
          # Developer ID certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always

      - name: Update GitHub Release title and notes
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f release-notes.md ]; then
            TITLE="$(cat release-title.txt 2>/dev/null || echo "$GITHUB_REF_NAME")"
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-notes.md || true
          fi

      # --- PACKAGE ONLY (manual runs) ---
      - name: Package (no publish)
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLDesk-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
