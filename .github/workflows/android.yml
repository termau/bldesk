name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # setup-android takes a `packages` list only; `api-level` / `build-tools`
      # were never inputs and were ignored. Its default list includes the
      # long-obsolete `tools` package, which the SDK repository no longer
      # serves, so name exactly what the build uses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Typed API Schema
        run: npm run generate-api

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build.log

      - name: Prepare APK Output
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/BLDesk-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLDesk-android-apk
          path: release/BLDesk-android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/BLDesk-android.apk
          draft: false
          prerelease: false
          generate_release_notes: false
