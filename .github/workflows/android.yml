name: Build Android APK

# Called by release.yml for every v* tag, so the APK is attached to the draft
# release before it is published (published releases are immutable). Also runs
# on its own via workflow_dispatch to build an APK without releasing.
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_B64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '21'

      # setup-android takes a `packages` list only; `api-level` / `build-tools`
      # were never inputs and were ignored. Its default list includes the
      # long-obsolete `tools` package, which the SDK repository no longer
      # serves, so name exactly what the build uses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # --legacy-peer-deps as in release.yml: package-lock.json is generated
      # that way, and plain `npm ci` resolves peers differently and rejects it.
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Typed API Schema
        run: npm run generate-api

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle

      # The signing key exists only as a repository secret. It is written to a
      # temp file for this step alone and removed straight after, and the
      # build fails if it is missing (android/app/build.gradle).
      - name: Build Android APK (Release)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/bldesk-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1 || (cat build.log && exit 1)

      # The key used until 1.1.0 was committed to this public repository, so
      # anyone can sign with it. Never ship an APK carrying it.
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          CERTS=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK")
          echo "$CERTS" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          SHA=$(echo "$CERTS" | grep -m1 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$SHA" = "d6a6134ab5c661cf2b963dae265b661f9516caa2b3920d637d0ef1cea9cde67a" ]; then
            echo "::error::The APK is signed with the retired, public key."
            exit 1
          fi

      - name: Upload Gradle Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-build-log
          path: android/build.log

      - name: Prepare APK Output
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/BLDesk-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BLDesk-android-apk
          path: release/BLDesk-android.apk
